# orders-api — common values applied to every environment.
image:
  repository: acrplatsbxcus14462b.azurecr.io/orders-api
ingress:
  enabled: true
  clusterIssuer: letsencrypt-staging # untrusted certs, safe rate limits; prd overrides
externalSecret:
  enabled: true
  storeRef: team-alpha-store
  data:
    - secretKey: DB_PASSWORD
      remoteKey: orders-db-password
env:
  - name: SERVICE_NAME
    value: orders-api
# distroless 'nonroot' is uid 65532; pin numerically so kubelet can verify runAsNonRoot.
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
