# TEAM-OWNED identity for ESO in team-alpha (sbx/azure/centralus). Only the SecretStore uses this
# ServiceAccount; app pods do NOT, so they never get vault access. ESO requests a token for it and
# exchanges it for team-alpha's own user-assigned managed identity.
#
# The identity's federated credential (created by team-alpha in its own subscription) MUST trust
# exactly: issuer = this cluster's OIDC issuer URL, subject = system:serviceaccount:team-alpha:eso-reader
# (no wildcards). That exact subject is what stops another team from using this identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: team-alpha
  annotations:
    azure.workload.identity/client-id: "REPLACE_TEAM_ALPHA_UAMI_CLIENT_ID" # team-alpha's UAMI (Key Vault Secrets User on its vault)
