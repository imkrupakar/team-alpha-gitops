# TEAM-OWNED identity for ESO in team-alpha (sbx/aws/us-east-1). Only the SecretStore uses this
# ServiceAccount; app pods do NOT, so they never get Secrets Manager access.
#
# The IAM role (created by team-alpha in its own account) MUST have a trust policy on the cluster's
# OIDC provider with StringEquals on BOTH
#   <issuer>:sub = system:serviceaccount:team-alpha:eso-reader
#   <issuer>:aud = sts.amazonaws.com
# An aud-only condition lets any ServiceAccount in the cluster assume the role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: team-alpha
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_TEAM_ALPHA_ESO_ROLE_ARN" # secretsmanager:GetSecretValue on team-alpha secrets only
