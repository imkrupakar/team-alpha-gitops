# TEAM-OWNED ESO SecretStore (team-alpha) for AWS (EKS) clusters: AWS Secrets Manager via IRSA.
# team-alpha owns its AWS account, secrets, and the IRSA role. Same NAME as the azure variant so
# the chart's externalSecret.storeRef stays cloud-agnostic. Secrets Manager is regional — when a
# second AWS region joins, key this under infra/aws/<region>/ and have the wiring select region.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: team-alpha-store
  namespace: team-alpha
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: default
