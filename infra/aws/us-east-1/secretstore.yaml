# TEAM-OWNED ESO SecretStore (team-alpha) for AWS (EKS) clusters in the US-EAST-1 region: AWS
# Secrets Manager via IRSA. team-alpha owns its AWS account, secrets, and the IRSA role. Same NAME
# as every region/cloud variant so the chart's externalSecret.storeRef stays cloud- and
# region-agnostic. Secrets Manager is regional: this store points at us-east-1; a second region gets
# its own infra/aws/<region>/secretstore.yaml (use native multi-region replica secrets to sync).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: team-alpha-store
  namespace: team-alpha
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: default
