# TEAM-OWNED ESO SecretStore (team-alpha) for AZURE clusters in the CENTRALUS region. Points at team-alpha's OWN Key Vault
# with workload-identity auth (no static creds). The platform never creates this — team-alpha owns
# its subscription, vault, secrets, and federated identity. Applied by the platform
# tenants-secretstore ApplicationSet into the team-alpha namespace. Namespaced + cloud-specific;
# the same NAME on every cloud keeps the chart's externalSecret.storeRef cloud-agnostic.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: team-alpha-store
  namespace: team-alpha
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://kv-team-alpha-centralus.vault.azure.net" # team-alpha's OWN region-local vault
      serviceAccountRef:
        name: default
